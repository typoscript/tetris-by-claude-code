<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <style>
    :root {
      --bg:        #1a1a2e;
      --panel-bg:  #16213e;
      --board-bg:  #0d0d1a;
      --border:    #444;
      --border2:   #333;
      --text:      #eee;
      --muted:     #888;
      --muted2:    #666;
      --accent:    #e94560;
      --accent-hv: #c73652;
      --grid:      #1e1e3a;
    }
    [data-theme="light"] {
      --bg:        #f0f2f5;
      --panel-bg:  #ffffff;
      --board-bg:  #e8eaf0;
      --border:    #bbb;
      --border2:   #ddd;
      --text:      #1a1a2e;
      --muted:     #555;
      --muted2:    #888;
      --accent:    #e94560;
      --accent-hv: #c73652;
      --grid:      #d0d4e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    #topbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .icon-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-size: 18px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: var(--border2); }

    #app {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    canvas {
      border: 2px solid var(--border);
      background: var(--board-bg);
      display: block;
      transition: background 0.3s, border-color 0.3s;
    }

    #panel {
      width: 140px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .box {
      background: var(--panel-bg);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 12px;
      transition: background 0.3s, border-color 0.3s;
    }

    .box h3 {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .box .value {
      font-size: 22px;
      font-weight: bold;
      color: var(--accent);
    }

    #next-canvas {
      border: none;
      background: transparent;
      margin-top: 4px;
    }

    #btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
    }
    #btn:hover { background: var(--accent-hv); }

    #keys {
      font-size: 11px;
      color: var(--muted2);
      line-height: 1.9;
    }
  </style>
</head>
<body>

<div id="topbar">
  <button class="icon-btn" id="theme-btn" title="라이트/다크 모드">🌙</button>
  <button class="icon-btn" id="music-btn" title="음악 켜기/끄기">🔇</button>
</div>

<div id="app">
  <canvas id="board" width="300" height="600"></canvas>
  <div id="panel">
    <div class="box">
      <h3>Score</h3>
      <div class="value" id="score">0</div>
    </div>
    <div class="box">
      <h3>Lines</h3>
      <div class="value" id="lines">0</div>
    </div>
    <div class="box">
      <h3>Level</h3>
      <div class="value" id="level">1</div>
    </div>
    <div class="box">
      <h3>Next</h3>
      <canvas id="next-canvas" width="100" height="100"></canvas>
    </div>
    <button id="btn">START</button>
    <div id="keys">
      ← → &nbsp;이동<br>
      ↑ &nbsp;&nbsp;&nbsp;&nbsp;회전<br>
      ↓ &nbsp;&nbsp;&nbsp;&nbsp;빠르게<br>
      Space &nbsp;즉시낙하
    </div>
  </div>
</div>

<audio id="bgm" src="bgm.wav" loop></audio>

<script>
const COLS = 10, ROWS = 20, BLOCK = 30;

const PIECES = [
  { shape: [[1,1,1,1]],               color: '#00f0f0' },
  { shape: [[1,1],[1,1]],             color: '#f0f000' },
  { shape: [[0,1,0],[1,1,1]],         color: '#a000f0' },
  { shape: [[1,0],[1,0],[1,1]],       color: '#f0a000' },
  { shape: [[0,1],[0,1],[1,1]],       color: '#0000f0' },
  { shape: [[0,1,1],[1,1,0]],         color: '#00f000' },
  { shape: [[1,1,0],[0,1,1]],         color: '#f00000' },
];

const canvas   = document.getElementById('board');
const ctx      = canvas.getContext('2d');
const nextCanvas = document.getElementById('next-canvas');
const nCtx     = nextCanvas.getContext('2d');
const scoreEl  = document.getElementById('score');
const linesEl  = document.getElementById('lines');
const levelEl  = document.getElementById('level');
const btn      = document.getElementById('btn');
const themeBtn = document.getElementById('theme-btn');
const musicBtn = document.getElementById('music-btn');
const bgm      = document.getElementById('bgm');

// ── 테마 ──────────────────────────────────────────────
let isDark = true;
themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeBtn.textContent = isDark ? '🌙' : '☀️';
});

// ── 음악 ──────────────────────────────────────────────
let musicOn = false;
bgm.volume = 0.45;

musicBtn.addEventListener('click', () => {
  musicOn = !musicOn;
  if (musicOn) {
    bgm.play().catch(() => {});
    musicBtn.textContent = '🔊';
  } else {
    bgm.pause();
    musicBtn.textContent = '🔇';
  }
});

// ── 게임 상태 ─────────────────────────────────────────
let board = newBoard(), piece, nextPiece;
let score, lines, level, gameOver, running, dropTimer, dropInterval;

function newBoard() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function randomPiece() {
  const p = PIECES[Math.floor(Math.random() * PIECES.length)];
  return {
    shape: p.shape.map(r => [...r]),
    color: p.color,
    x: Math.floor(COLS / 2) - Math.floor(p.shape[0].length / 2),
    y: 0,
  };
}

function rotate(shape) {
  return shape[0].map((_, i) => shape.map(row => row[i]).reverse());
}

function valid(b, p, ox = 0, oy = 0, shape = p.shape) {
  return shape.every((row, r) =>
    row.every((cell, c) => {
      if (!cell) return true;
      const nx = p.x + c + ox, ny = p.y + r + oy;
      return nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !b[ny]?.[nx];
    })
  );
}

function place(b, p) {
  p.shape.forEach((row, r) =>
    row.forEach((cell, c) => { if (cell) b[p.y + r][p.x + c] = p.color; })
  );
}

function clearLines(b) {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; ) {
    if (b[r].every(cell => cell)) { b.splice(r, 1); b.unshift(Array(COLS).fill(null)); cleared++; }
    else r--;
  }
  return cleared;
}

const LINE_SCORES = [0, 100, 300, 500, 800];

function spawn() {
  piece = nextPiece || randomPiece();
  nextPiece = randomPiece();
  if (!valid(board, piece)) {
    gameOver = true;
    running = false;
    btn.textContent = 'RESTART';
    drawOverlay();
    if (musicOn) { bgm.pause(); bgm.currentTime = 0; musicOn = false; musicBtn.textContent = '🔇'; }
  }
}

function drop() {
  if (!running) return;
  if (valid(board, piece, 0, 1)) {
    piece.y++;
  } else {
    place(board, piece);
    const n = clearLines(board);
    if (n) {
      lines += n;
      score += LINE_SCORES[n] * level;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(100, 1000 - (level - 1) * 100);
      clearInterval(dropTimer);
      dropTimer = setInterval(() => { if (running) drop(); }, dropInterval);
      updateUI();
    }
    spawn();
  }
}

function hardDrop() {
  while (valid(board, piece, 0, 1)) piece.y++;
  drop();
}

function updateUI() {
  scoreEl.textContent = score;
  linesEl.textContent = lines;
  levelEl.textContent = level;
}

// ── 그리기 ────────────────────────────────────────────
function drawBlock(context, x, y, color, size = BLOCK) {
  context.fillStyle = color;
  context.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
  context.fillStyle = 'rgba(255,255,255,0.18)';
  context.fillRect(x * size + 1, y * size + 1, size - 2, 4);
  context.fillStyle = 'rgba(0,0,0,0.25)';
  context.fillRect(x * size + 1, y * size + size - 5, size - 2, 4);
}

function drawGhost() {
  let gy = piece.y;
  while (valid(board, { ...piece, y: gy + 1 })) gy++;
  if (gy === piece.y) return;
  ctx.globalAlpha = 0.2;
  piece.shape.forEach((row, r) =>
    row.forEach((cell, c) => { if (cell) drawBlock(ctx, piece.x + c, gy + r, piece.color); })
  );
  ctx.globalAlpha = 1;
}

function draw() {
  const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = gridColor || '#1e1e3a';
  ctx.lineWidth = 0.5;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      ctx.strokeRect(c * BLOCK, r * BLOCK, BLOCK, BLOCK);

  board.forEach((row, r) =>
    row.forEach((color, c) => { if (color) drawBlock(ctx, c, r, color); })
  );

  if (running && piece) {
    drawGhost();
    piece.shape.forEach((row, r) =>
      row.forEach((cell, c) => { if (cell) drawBlock(ctx, piece.x + c, piece.y + r, piece.color); })
    );
  }

  nCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (nextPiece) {
    const ns = 20;
    const offX = Math.floor((5 - nextPiece.shape[0].length) / 2);
    const offY = Math.floor((5 - nextPiece.shape.length) / 2);
    nextPiece.shape.forEach((row, r) =>
      row.forEach((cell, c) => {
        if (cell) {
          nCtx.fillStyle = nextPiece.color;
          nCtx.fillRect((offX + c) * ns + 1, (offY + r) * ns + 1, ns - 2, ns - 2);
        }
      })
    );
  }

  requestAnimationFrame(draw);
}

function drawOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 28px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
  ctx.fillStyle = '#eee';
  ctx.font = '16px Courier New';
  ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 16);
}

// ── 시작 ──────────────────────────────────────────────
function startGame() {
  board = newBoard();
  score = 0; lines = 0; level = 1;
  dropInterval = 800;
  gameOver = false;
  running = true;
  nextPiece = randomPiece();
  spawn();
  updateUI();
  btn.textContent = 'RESTART';
  clearInterval(dropTimer);
  dropTimer = setInterval(() => { if (running) drop(); }, dropInterval);
  if (musicOn) { bgm.currentTime = 0; bgm.play().catch(() => {}); }
}

btn.addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  if (!running) return;
  switch (e.key) {
    case 'ArrowLeft':  if (valid(board, piece, -1)) piece.x--; break;
    case 'ArrowRight': if (valid(board, piece,  1)) piece.x++; break;
    case 'ArrowDown':  drop(); break;
    case 'ArrowUp': {
      const r = rotate(piece.shape);
      if (valid(board, piece, 0, 0, r)) piece.shape = r;
      break;
    }
    case ' ': e.preventDefault(); hardDrop(); break;
  }
});

draw();
</script>
</body>
</html>
