<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tetris</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>

<div id="topbar">
  <button class="icon-btn" id="theme-btn" title="라이트/다크 모드">🌙</button>
  <button class="icon-btn" id="music-btn" title="음악 켜기/끄기">🔇</button>
</div>

<div id="app">
  <canvas id="board" width="300" height="600"></canvas>
  <div id="panel">
    <div class="panel-stat-row">
      <div class="box">
        <h3>Score</h3>
        <div class="value" id="score">0</div>
      </div>
      <div class="box">
        <h3>Lines</h3>
        <div class="value" id="lines">0</div>
      </div>
      <div class="box">
        <h3>Level</h3>
        <div class="value" id="level">1</div>
      </div>
    </div>
    <div class="panel-next-row">
      <div class="box" id="next-box">
        <h3>Next</h3>
        <canvas id="next-canvas" width="100" height="100"></canvas>
      </div>
      <button id="btn-mobile" class="mobile-only">START</button>
    </div>
    <button id="btn">START</button>
    <div id="keys">
      ← → &nbsp;이동<br>
      ↑ &nbsp;&nbsp;&nbsp;&nbsp;회전<br>
      ↓ &nbsp;&nbsp;&nbsp;&nbsp;빠르게<br>
      Space &nbsp;즉시낙하
    </div>
  </div>
</div>

<!-- 모바일 게임패드 -->
<div id="gamepad">
  <div class="gc-left-group">
    <div class="gc-lr">
      <button class="gc-btn gc-left"  id="gc-left"  aria-label="왼쪽">◀</button>
      <button class="gc-btn gc-right" id="gc-right" aria-label="오른쪽">▶</button>
    </div>
  </div>
  <div class="gc-right-group">
    <div class="gc-mid-row">
      <button class="gc-btn gc-down"   id="gc-down"   aria-label="아래">▼</button>
      <button class="gc-btn gc-rotate" id="gc-rotate" aria-label="회전">↺</button>
    </div>
    <button class="gc-btn gc-drop" id="gc-drop" aria-label="즉시 낙하">⚡</button>
  </div>
</div>

<audio id="bgm" src="assets/bgm.wav" loop></audio>

<script src="js/game.js"></script>
</body>
</html>
